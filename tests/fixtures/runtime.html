<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>CmdZ runtime test</title>
  </head>
  <body tabindex="0">
    <h1>CmdZ runtime test</h1>

    <label>
      Native input
      <input id="native-input">
    </label>
    <label>Textarea <textarea id="textarea"></textarea></label>
    <label>Password <input id="password" type="password"></label>
    <label>Cancels native Undo <input id="canceled-beforeinput"></label>
    <div id="shadow-host"></div>

    <div id="contenteditable" contenteditable="true" role="textbox">
      Editable text
    </div>

    <div id="application" role="application" tabindex="0">
      Custom application
    </div>

    <button id="stopped-keydown" type="button">
      Stops keydown propagation
    </button>

    <label>
      Stops beforeinput propagation
      <input id="stopped-beforeinput">
    </label>

    <label>
      Hides beforeinput from listeners installed later
      <input id="hidden-beforeinput">
    </label>

    <iframe
      id="docs-frame"
      title="Editable child frame"
      srcdoc="<!doctype html><html><body contenteditable='true' role='textbox'>Frame text</body></html>"
    ></iframe>

    <script>
      window.applicationUndoCount = 0;
      window.shortcutEvents = [];
      const isMac = /mac/i.test(navigator.userAgentData?.platform || navigator.platform);
      const isUndo = (event) => event.key.toLowerCase() === "z" &&
        !event.altKey && !event.shiftKey &&
        (isMac ? event.metaKey && !event.ctrlKey : event.ctrlKey && !event.metaKey);

      document.getElementById("shadow-host").attachShadow({ mode: "open" })
        .innerHTML = '<label>Shadow input <input id="shadow-input"></label>';
      document.getElementById("canceled-beforeinput").addEventListener("beforeinput", (event) => {
        if (event.inputType === "historyUndo") event.preventDefault();
      });

      window.addEventListener(
        "keydown",
        (event) => {
          if (isUndo(event)) {
            window.shortcutEvents.push({
              defaultPrevented: event.defaultPrevented,
              target: event.target.id || event.target.localName,
            });
          }
        },
        true
      );

      document
        .getElementById("application")
        .addEventListener("keydown", (event) => {
          if (isUndo(event)) {
            event.preventDefault();
            window.applicationUndoCount += 1;
          }
        });

      document
        .getElementById("stopped-keydown")
        .addEventListener("keydown", (event) => {
          if (isUndo(event)) {
            event.stopPropagation();
          }
        });

      window.addEventListener(
        "beforeinput",
        (event) => {
          if (
            event.target.id === "hidden-beforeinput" &&
            event.inputType === "historyUndo"
          ) {
            event.stopImmediatePropagation();
          }
          if (
            event.target.id === "stopped-beforeinput" &&
            event.inputType === "historyUndo"
          ) {
            event.stopPropagation();
          }
        },
        true
      );
    </script>
  </body>
</html>

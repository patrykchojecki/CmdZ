name: Bug report
description: Report a reproducible problem with CmdZ
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        For shortcut problems, first read SUPPORT.md and check CmdZ's site access at `chrome://extensions`. CmdZ does not register a browser-scoped shortcut.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you were doing when it occurred.
      placeholder: After closing a tab and pressing Command + Z...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Close ...
        3. Press ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect CmdZ to do?
    validations:
      required: true

  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      description: Find this at `chrome://version`.
      placeholder: 140.0.7339.80
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system and version
      placeholder: macOS, Windows, or Linux version
    validations:
      required: true

  - type: input
    id: cmdz-version
    attributes:
      label: CmdZ version and installation source
      description: Include the version from `chrome://extensions` and whether you used a release ZIP or repository checkout.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant screenshots, extension errors, or other details. Do not include sensitive information.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I tested the latest released version of CmdZ.
          required: true
